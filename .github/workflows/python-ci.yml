name: Python and Js CI

on: [push]

jobs:
  test-js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      
      - name: Run tests
        run: node js/test.js
  
  test-python:
    runs-on: ubuntu-latest

    defaults:
      run:           # this is a name for a section not running syntax
        working-directory: python/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' 
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest test.py

      - name: Run Litn
        run: pylint *.py
