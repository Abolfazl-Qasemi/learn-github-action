name: Python CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    #defaults:
      #run:           # this is a name for a section not running syntax
        #working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: pytest test.py
