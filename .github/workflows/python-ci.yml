name: Python CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./learn-github-action

    steps:
      - name: Checkout code
        run: git clone https://github.com/Abolfazl-Qasemi/learn-github-action.git

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip install pytest

      - name: Run tests
        run: pytest test.py
