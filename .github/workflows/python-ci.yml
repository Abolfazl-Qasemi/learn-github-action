name: Python CI/CD

on: [push]
jobs:
  
  test-python:
    runs-on: ubuntu-latest

    defaults:
      run:           # this is a name for a section not running syntax
        working-directory: python/


    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'  
          cache-dependency-path: python/requirements.txt #need to set path 
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest test.py

      - name: Run Litn
        run: pylint *.py
